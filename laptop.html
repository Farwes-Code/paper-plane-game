<!DOCTYPE html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{margin:0;font-family:sans-serif;background:#cfe8ff;overflow:hidden}
  #status{position:fixed;top:10px;left:10px;margin:0;font-size:20px;
          max-width:35vw;z-index:5}
  svg{width:100vw;height:100vh}
  path{fill:#f3e9c6;stroke:#555;stroke-width:.5}
  path.hit{fill:#ff7a59}
  #plane{position:fixed;left:0;top:0;font-size:48px;pointer-events:none;
         z-index:10;display:none}
  #card{position:fixed;right:20px;top:20px;width:min(340px,40vw);
  background:#fff;border-radius:14px;padding:14px;z-index:6;
  box-shadow:0 4px 18px #0004;display:none;max-height:90vh;overflow:auto}
  #count{position:fixed;bottom:10px;left:10px;font-size:20px;z-index:5;
  background:#fff;padding:6px 12px;border-radius:10px}
path.seen{fill:#b9e3a8}
#card img{width:100%;border-radius:10px;margin-bottom:8px}
#card h2{margin:0 0 6px}
#card p{margin:0;font-size:15px;line-height:1.4}
</style>
<h3 id="status">Connecting...</h3>
<svg id="map"></svg>
<div id="plane">✈️</div> 
<div id="count">Visited: 0/25</div>
<div id="card"><img id="cimg"><h2 id="ctitle"></h2><p id="ctext"></p></div>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script>
const TOPIC = "plane-me-0001"; 
const status = document.getElementById("status");
const plane = document.getElementById("plane");
let busy = false;
let curLang = "en";
const visited = new Set();

fetch("district.geojson").then(r => r.json()).then(geo => {  
  const projection = d3.geoIdentity().reflectY(true)
    .fitSize([innerWidth, innerHeight], geo);
  const path = d3.geoPath(projection);
  d3.select("#map").selectAll("path").data(geo.features).join("path")
    .attr("d", path);
  start();
});

function start() {
  const es = new EventSource(`https://ntfy.sh/${TOPIC}/sse`);
  es.onopen = () => status.textContent = "Connected ✅ plane ready, swipe!";
  es.onerror = () => status.textContent = "Connection error ❌";
  es.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.event !== "message") return;
    const d = JSON.parse(m.message);
    curLang = d.lang || "en";
    throwPlane(d.angle, d.speed);
  };
}

function throwPlane(angle, speed) {
  if (busy) return;
  busy = true;
  const w = innerWidth, h = innerHeight;
  const R = Math.min(w, h) / 2;
  const dx = Math.cos(angle), dy = -Math.sin(angle);   // screen y goes down
  const dist = Math.max(speed * 250, 60);              // harder swipe = further
  const x0 = w/2 - dx*R, y0 = h/2 - dy*R;              // start near edge
  const x1 = x0 + dx*dist, y1 = y0 + dy*dist;
  const rot = 45 - angle*180/Math.PI;                  // emoji points up-right

  document.querySelectorAll("path.hit").forEach(p => p.classList.remove("hit"));
  status.textContent = "Plane flying... ✈️";
  plane.style.display = "block";
  const tf = (x, y) => `translate(${x-24}px,${y-24}px) rotate(${rot}deg)`;
  plane.animate([{transform: tf(x0, y0)}, {transform: tf(x1, y1)}],
    {duration: 1800, easing: "ease-out", fill: "forwards"})
    .onfinish = () => land(x1, y1);
}

async function land(x, y) {
  const card = document.getElementById("card");
  const hit = document.elementsFromPoint(x, y).find(el => el.tagName === "path");
  if (!hit) {
    card.style.display = "none";
    status.textContent = "The Plane fell into the ocean 🌊 try Again!";
    busy = false; return;
  }
  hit.classList.add("hit");
  const full = hit.__data__.properties.shapeName;
  status.textContent = `Landed in ${full} 🎉`;

  visited.add(full);
  hit.classList.add("seen");
  document.getElementById("count").textContent = `Visited ${visited.size}/25`;
  if (visited.size === 25) status.textContent = "All 25 districts visited! 🏆";

  let lang = curLang, title = full.replace(/ /g, "_"), shown = full;
  try {
    if (lang !== "en") {
      const ll = await (await fetch(
        "https://en.wikipedia.org/w/api.php?action=query&prop=langlinks&lllang=" +
        lang + "&format=json&origin=*&titles=" + encodeURIComponent(title))).json();
      const pg = Object.values(ll.query.pages)[0];
      if (pg.langlinks && pg.langlinks[0]) {
        title = pg.langlinks[0]["*"]; shown = title;
      } else lang = "en";   // page illa → English
    }
    const j = await (await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/` +
      encodeURIComponent(title))).json();
    document.getElementById("ctitle").textContent = shown;
    document.getElementById("ctext").textContent = j.extract || "No summary found.";
    const img = document.getElementById("cimg");
    if (j.thumbnail) { img.src = j.thumbnail.source; img.style.display = "block"; }
    else img.style.display = "none";
  } catch (e) {
    document.getElementById("ctitle").textContent = full;
    document.getElementById("ctext").textContent = "Summary load aagala 😕";
  }
  card.style.display = "block";
  busy = false;
}
</script>
